          const prioPillClass = j.priority === 'Super Rush' ? 'prio-super-rush' : j.priority === 'Rush' ? 'prio-rush' : '';
          return `<div class="job-card${hasNegotiate ? ' negotiate' : ''}" onclick="openJob('${j.id}')">
        <div class="jc-img"><img src="${jobImage(j, 2, 800, 520)}" alt="${j.design}" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=800 height=520><rect width=800 height=520 fill=%23eef2f7/></svg>'"></div>
        <div class="jc-body">
          <div class="jc-title">${j.design}</div>
          <div class="jc-desc">${j.summary}</div>
          <div class="jc-meta">
            <span class="jc-pill id">${j.id}</span>
            <span class="jc-pill order">${j.order}</span>
            <span class="jc-pill ${prioPillClass}">${j.priority}</span>
            <span class="badge ${STATUS_MAP[j.status] || 'badge-gray'}" style="font-size:10.5px;padding:2px 8px">${j.status}</span>
          </div>
        </div>
        ${hasNegotiate ? `<div class="jc-negotiate-banner"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>Counter-offer received — $${j.adminPrice} · Tap to negotiate</div>` : ''}
      </div>`;
        }).join('')}
    </div>

    <div class="list-view">
      ${jobs.map(j => `<div class="list-item" onclick="openJob('${j.id}')">
        <div class="list-thumb"><img src="${jobImage(j, 3, 140, 140)}" alt="${j.design}" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=140 height=140><rect width=140 height=140 fill=%23eef2f7/></svg>'"></div>
        <div class="list-body">
          <div style="font-weight:700">${j.design}</div>
          <div style="margin-top:4px;color:var(--ink-4);font-size:11.5px;line-height:1.45">${j.summary}</div>
          <div style="color:var(--ink-4);font-size:12px">${j.id} · ${j.order} · ${j.status}</div>
        </div>
        <div style="font-family:var(--f-mono);font-size:11px;color:var(--ink-4)">${j.created}</div>
      </div>`).join('')}
    </div>

    <div class="empty table-empty" style="display:none;border-top:1px solid var(--border);">
      <div class="empty-icon">🔎</div>
      <div class="empty-text">No matching jobs</div>
    </div>
  </div>`;
    }

    /* ──── JOB MODAL ──── */
    function openJob(id) {
      const j = JOBS.find(x => x.id === id);
      if (!j) return;
      const steps = ['CS Review', 'Approved', 'Assigned', 'In Work', 'QC Review', 'CS Delivery'];
      const images = jobImages(j, 3);
      const isMobile = window.innerWidth <= 768;
      document.getElementById('modal-body').innerHTML = `
    ${isMobile ? '<div class="modal-pull-handle"></div>' : ''}
    <div class="modal-header">
      <div class="modal-header-left">
        <div class="modal-job-id">${j.id} &nbsp;·&nbsp; ${j.ref}</div>
        <div class="modal-job-name">${j.design}</div>
        <div class="modal-tags">
          <span class="badge ${ORDER_MAP[j.order] || 'badge-gray'}">${j.order}</span>
          <span class="badge ${STATUS_MAP[j.status] || 'badge-gray'}">${j.status}</span>
          <span class="prio-badge ${PRIO_MAP[j.priority]}">${j.priority}</span>
          <span class="badge badge-gray">${j.project}</span>
        </div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div style="margin-bottom:20px;">
        <div class="modal-section-title">Job Images</div>
        <div class="modal-gallery">
          ${images.map((src, index) => `<img src="${src}" alt="${j.design} image ${index + 1}" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=900 height=700><rect width=900 height=700 fill=%23eef2f7/></svg>'">`).join('')}
        </div>
      </div>
      <div style="margin-bottom:20px;">
        <div class="modal-section-title">Production Progress</div>
        <div class="progress-steps">
          ${steps.map((s, i) => `<div class="ps-step ${i < j.stage ? 'done' : i === j.stage ? 'cur' : ''}"><div class="ps-dot">${i < j.stage ? `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>` : i === j.stage ? `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="var(--crimson)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.51"/></svg>` : ''}</div><div class="ps-lbl">${s}</div></div>`).join('')}
        </div>
      </div>
      <div class="modal-grid">
        <div>
          <div class="modal-section-title">Job Details</div>
          ${[['Order Type', j.order], ['Process', j.process || '—'], ['Complexity', j.complexity], ['Colors', j.colors], ['Priority', j.priority], ['Assigned To', j.assignedTo], ['Created', j.created]].map(([k, v]) => `<div class="detail-row"><div class="detail-key">${k}</div><div class="detail-val">${v}</div></div>`).join('')}
        </div>
        <div>
          <div class="modal-section-title">Reference</div>
          ${[['Job ID', j.id], ['Reference No.', j.ref], ['Project Type', j.project], ['Status', j.status]].map(([k, v], i) => `<div class="detail-row"><div class="detail-key">${k}</div><div class="detail-val${i === 1 ? ' mono' : ''}">${v}</div></div>`).join('')}
          ${j.aiScore ? `<div class="detail-row"><div class="detail-key">AI QC Score</div><div class="detail-val" style="color:var(--green);font-weight:700">${Math.round((j.aiScore.colour + j.aiScore.align + j.aiScore.res + j.aiScore.brief) / 4)}/100 — Pass</div></div>` : ''}
        </div>
      </div>
      ${j.status === 'Quote Submitted' || j.status === 'Pending Approval' ? `
      <div class="modal-section-title">Price Negotiation</div>
      <div style="background:var(--off); border:1px solid var(--border); border-radius:var(--r); padding:16px; margin-bottom:20px;">
        <div class="detail-row" style="border:none; padding-top:0;">
          <div class="detail-key">Your Proposed Price</div>
          <div class="detail-val" style="font-size:14px; font-weight:700; color:var(--ink)">$${j.clientPrice || 'TBD'}</div>
        </div>
        
        ${j.adminPrice ? `
        <div class="detail-row" style="border-top:1px dashed var(--border-md); margin-top:4px;">
          <div class="detail-key" style="color:var(--crimson)">Admin Counter-Offer</div>
          <div class="detail-val" style="font-size:14px; font-weight:700; color:var(--crimson)">$${j.adminPrice}</div>
        </div>
        
        <!-- Default Actions -->
        <div id="client-actions-ui" style="display:flex; gap:10px; margin-top:16px;">
          <button class="btn btn-primary" onclick="toast('Price of $${j.adminPrice} Approved!','success'); closeModal();">Accept Offer</button>
          <button class="btn btn-outline" onclick="document.getElementById('client-actions-ui').style.display='none'; document.getElementById('client-counter-ui').style.display='block';">Counter Offer</button>
        </div>
        
        <!-- Hidden Counter-Offer UI -->
        <div id="client-counter-ui" style="display:none; margin-top:16px; padding-top:16px; border-top:1px dashed var(--border-md);">
          <label style="font-size:11.5px; font-weight:600; color:var(--ink-3); display:block; margin-bottom:8px;">Your New Counter-Offer ($)</label>
          <div style="display:flex; gap:10px;">
            <input type="number" class="fi" id="client-new-price" placeholder="e.g. 165" style="width:140px; padding:8px 12px; border:1px solid var(--border); border-radius:var(--r); outline:none;">
            <button class="btn btn-primary" onclick="toast('New counter-offer sent!','success'); closeModal();">Submit</button>
            <button class="btn btn-outline" onclick="document.getElementById('client-counter-ui').style.display='none'; document.getElementById('client-actions-ui').style.display='flex';">Cancel</button>
          </div>
        </div>
        ` : `
        <div style="margin-top:12px; font-size:12px; color:var(--ink-4); display:flex; align-items:center; gap:6px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Awaiting agency review...
        </div>
        `}
      </div>
      ` : ''}
      <div class="modal-section-title">Brief / Notes</div>
      <div style="background:var(--off);border:1px solid var(--border);border-radius:var(--r);padding:14px;font-size:13px;color:var(--ink-3);line-height:1.7;margin-bottom:16px">${j.notes}</div>
      ${j.aiScore ? `
      <div class="modal-section-title">AI QC Report</div>
      <div style="background:var(--off);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
          <div style="padding:3px 10px;border-radius:99px;background:var(--navy);color:white;font-size:10px;font-weight:700;letter-spacing:0.06em">AI ANALYSIS</div>
          <div style="font-size:12px;color:var(--ink-4)">Auto-generated · First-pass reference only</div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px">
          ${[['Colour', j.aiScore.colour, '#B22234'], ['Alignment', j.aiScore.align, '#002868'], ['Resolution', j.aiScore.res, '#D97706'], ['Brief', j.aiScore.brief, '#059669']].map(([l, v, c]) => `
          <div style="text-align:center">
            <div style="font-size:9.5px;font-weight:700;color:var(--ink-4);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px">${l}</div>
            <div style="height:4px;background:var(--surface);border-radius:99px;overflow:hidden;margin-bottom:5px"><div style="width:${v}%;height:100%;background:${c};border-radius:99px;transition:width 0.9s"></div></div>
            <div style="font-family:var(--f-mono);font-size:13px;font-weight:500;color:${c}">${v}</div>
          </div>`).join('')}
        </div>
        <div style="padding:10px 14px;background:var(--green-lt);border:1px solid rgba(5,150,105,0.2);border-radius:var(--r);font-size:12.5px;color:var(--green);font-weight:500">
          ✓ AI Recommendation: <strong>PASS</strong> — Meets quality standards. Minor colour variance within acceptable tolerance.
        </div>
      </div>` : ''}

    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Close</button>
      ${j.status === 'Delivered'
          ? `<button class="btn btn-navy" onclick="toast('Downloading project files…','success');closeModal()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Download Files</button>
          <button class="btn btn-primary" onclick="toast('Modification request opened for ${j.id}','info');closeModal()">Request Modification</button>`
          : `<button class="btn btn-primary" onclick="toast('You will be notified when status changes','info');closeModal()">Track This Job</button>`
        }
    </div>`;
      document.getElementById('overlay').classList.add('open');
      if (window.innerWidth <= 768) {
        document.body.style.overflow = 'hidden';
      }
    }
    function closeModal(e) {
      if (e && e.target !== document.getElementById('overlay')) return;
      document.getElementById('overlay').classList.remove('open');
      document.body.style.overflow = '';
    }

    /* ──── NOTIFICATIONS ──── */
    function buildNotifs() {
      document.getElementById('np-list').innerHTML = NOTIFS.map(n => `
    <div class="np-item ${n.read ? '' : 'unread'}" onclick="this.classList.remove('unread')">
      <div class="np-icon" style="background:${n.bg};font-size:16px">${n.icon}</div>
      <div><div class="np-text">${n.text}</div><div class="np-time">${n.time}</div></div>
    </div>`).join('');
      syncNotifPip();
    }
    function toggleNotif() {
      notifOpen = !notifOpen;
      document.getElementById('notif-panel').classList.toggle('open', notifOpen);
    }
    function clearNotifs() {
      document.querySelectorAll('.np-item').forEach(el => el.classList.remove('unread'));
      syncNotifPip();
      toast('All notifications marked as read', 'success');
    }
    function syncNotifPip() {
      const pip = document.querySelector('.notif-pip');
      if (!pip) return;
      pip.style.display = document.querySelector('.np-item.unread') ? '' : 'none';
    }
    document.addEventListener('click', e => {
      if (notifOpen && !document.getElementById('notif-panel').contains(e.target) && !e.target.closest('.top-icon')) {
        notifOpen = false;
        document.getElementById('notif-panel').classList.remove('open');
      }
    });

    /* ──── TRACKING TOGGLE ──── */
    function toggleTC(el) {
      const body = el.nextElementSibling;
      const arrow = el.querySelector('svg:last-child');
      const open = body.style.display === 'block';
      body.style.display = open ? 'none' : 'block';
      arrow.style.transform = open ? '' : 'rotate(180deg)';
    }

    /* ──── FILTER JOBS ──── */
    function filterJobs(type, el) {
      document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('on'));
      el.classList.add('on');
      const map = {
        all: JOBS,
        active: JOBS.filter(j => j.stage === 2 || j.stage === 3),
        qc: JOBS.filter(j => j.stage === 4),
        delivered: JOBS.filter(j => j.stage === 6),
      };
      document.getElementById('jobs-table').innerHTML = jobTable(map[type] || JOBS);
      const input = document.querySelector('#jobs-table .search-inp');
      if (input) {
        input.value = jobSearchQuery;
        searchJobs(input);
      }
    }

    function setJobView(view, btn) {
      const root = btn.closest('.jobs-root');
      if (!root) return;
      root.setAttribute('data-view', view);
      root.querySelectorAll('.view-toggle button').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
    }

    /* ──── ORDER TYPE SELECT ──── */
    function selectOrder(el) {
      document.querySelectorAll('.order-type').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
    }

    /* ──── JOB SEARCH ──── */
    function searchJobs(input) {
      jobSearchQuery = input.value.trim();
      const tableWrap = input.closest('.jobs-root');
      if (!tableWrap) return;
      const query = jobSearchQuery.toLowerCase();
      const currentView = tableWrap.getAttribute('data-view') || 'grid';
      const rows = tableWrap.querySelectorAll('tbody tr');
      let visibleCount = 0;

      rows.forEach(row => {
        const matches = row.textContent.toLowerCase().includes(query);
        row.style.display = matches ? '' : 'none';
        if (matches) visibleCount += 1;
      });

      if (currentView === 'table') {
        const empty = tableWrap.querySelector('.table-empty');
        const table = tableWrap.querySelector('.table-view table');
        if (empty && table) {
          empty.style.display = visibleCount ? 'none' : 'block';
          table.style.display = visibleCount ? '' : 'none';
        }
      }

      tableWrap.querySelectorAll('.grid-view .job-card').forEach(card => {
        card.style.display = card.textContent.toLowerCase().includes(query) ? '' : 'none';
      });
      tableWrap.querySelectorAll('.list-view .list-item').forEach(item => {
        item.style.display = item.textContent.toLowerCase().includes(query) ? '' : 'none';
      });
    }

    /* ──── SUBMIT QUOTE ──── */
    function submitQuote() {
      toast('Quote submitted! Ref: 05-05-2025-C001-013-A · We\'ll respond within 2 hours.', 'success');
      setTimeout(() => go('jobs', document.querySelector('[data-page=jobs]')), 1200);
    }

    /* Navigate directly to tracking/delivered projects */
    function goToTracking() {
      const el = document.querySelector('[data-page=tracking]');
      go('tracking', el);
    }

    function downloadFiles(id) {
      toast(`Downloading files for ${id}…`, 'success');
    }

    function requestModification(id) {
      toast(`Opening modification request for ${id}…`, 'info');
      // navigate to tracking page and optionally open a form/modal — demo uses toast
    }

    /* ──── TOAST ──── */
    function toast(msg, type = 'info') {
      const t = document.getElementById('toast');
      const icons = { success: '✓', error: '✕', info: 'i' };
      document.getElementById('t-icon').textContent = icons[type] || 'i';
      document.getElementById('t-text').textContent = msg;
      t.className = `show ${type}`;
      clearTimeout(toastTmr);
      toastTmr = setTimeout(() => t.className = '', 3500);
    }

    /* ──── HELPERS ──── */
    function greeting() {
      const h = new Date().getHours();
      return h < 12 ? 'Morning' : h < 17 ? 'Afternoon' : 'Evening';
    }
    function fmtDate() {
      return new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    }
    function handleAsk(e) {
      if (e.key === 'Enter') {
        const v = e.target.value.trim();
        if (v) { toast(`AI: "${v}" — This feature launches in V2`, 'info'); e.target.value = ''; }
      }
    }

    /* ──── AFTER RENDER ──── */
    function afterRender(page) {
      setTimeout(() => {
        document.querySelectorAll('.mb-fill').forEach(el => {
          const w = el.style.width;
          el.style.width = '0';
          setTimeout(() => el.style.width = w, 60);
        });
        if (page === 'tracking') {
          document.querySelectorAll('.tc-header').forEach(h => {
            const body = h.nextElementSibling;
            if (h.closest('.tracking-card') === document.querySelector('.tracking-card')) {
              body.style.display = 'block';
              h.querySelector('svg:last-child').style.transform = 'rotate(180deg)';
            }
          });
        }
      }, 80);
    }

    /* ──── MOBILE SIDEBAR ──── */
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      const isOpen = sidebar.classList.contains('open');
      if (isOpen) {
        closeSidebar();
      } else {
        sidebar.classList.add('open');
        backdrop.classList.add('open');
        document.body.style.overflow = 'hidden';
      }
    }

    function closeSidebar() {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      sidebar.classList.remove('open');
      backdrop.classList.remove('open');
      document.body.style.overflow = '';
    }

    /* ──── MOBILE BOTTOM NAV ──── */
    function setMobileNav(el) {
      // no-op: handled by syncMobileNav inside go()
    }

    function syncMobileNav(page) {
      document.querySelectorAll('.mn-item').forEach(item => {
        item.classList.toggle('active', item.dataset.page === page);
      });
    }

    // Wire up mobile bottom nav with touch-first event handling
    (function initMobileNav() {
      document.querySelectorAll('#mobile-nav .mn-item').forEach(function (item) {
        var navPage = item.dataset.page;
        var fired = false;

        // touchstart: fire immediately, mark as handled
        item.addEventListener('touchstart', function (e) {
          fired = true;
          // Immediate visual feedback
          item.style.transition = 'transform 0.08s, opacity 0.08s';
          // Navigate right away on touch
          var sidebarNavEl = document.querySelector('.nav-item[data-page="' + navPage + '"]');
          go(navPage, sidebarNavEl);
        }, { passive: true });

        // touchend: reset flag after a short delay to block the ghost click
        item.addEventListener('touchend', function (e) {
          setTimeout(function () { fired = false; }, 350);
        }, { passive: true });

        // click: only fires on desktop (where touchstart didn't run)
        item.addEventListener('click', function (e) {
          if (fired) return; // already handled by touchstart
          var sidebarNavEl = document.querySelector('.nav-item[data-page="' + navPage + '"]');
          go(navPage, sidebarNavEl);
        });
      });
    })();

    /* ──── INIT ──── */
    buildNotifs();
    go('dashboard', document.querySelector('[data-page=dashboard]'));
    syncMobileNav('dashboard');

    // Restore scrolling if overlay is closed
    document.getElementById('overlay').addEventListener('click', function (e) {
      if (e.target === this) {
        document.body.style.overflow = '';
      }
    });
  </script>
</body>

</html>
